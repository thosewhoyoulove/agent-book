<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5ebd2" />
    <meta name="description" content="从零实现 AI Agent：多游戏世界驱动的交互式 TypeScript 工程书" />
    <title>AGENT BOOK · 从零实现 AI Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const savedTheme = window.localStorage.getItem("agent-book-theme");
        const savedWorld = window.localStorage.getItem("agent-book-world");
        const validWorlds = ["stardew", "celeste", "hollow"];
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.dataset.world = validWorlds.includes(savedWorld) ? savedWorld : "stardew";
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.world = "stardew";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
